name: Build NADZIF AUTO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q "$(find . -maxdepth 1 -name 'NadzifAuto-source*.zip' | head -n 1)" -d .

      - name: Build APK
        run: gradle -p NadzifAuto assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NADZIF-AUTO-APK
          path: NadzifAuto/app/build/outputs/apk/debug/app-debug.apk
